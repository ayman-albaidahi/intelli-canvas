name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check for whitespace errors
        run: git diff --check
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q backend
      - name: Run tests with coverage
        run: pytest -q --cov=backend --cov-report=term-missing
      - name: Run Ruff
        run: ruff check backend tests
      - name: Check formatting
        run: ruff format --check backend tests
      - name: Audit dependencies
        run: pip-audit -r backend/requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: JavaScript syntax check
        run: find frontend/editor-v2/js -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run ESLint
        run: npx eslint frontend
      - name: Run Vitest
        run: npx vitest run

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/browser
          retention-days: 7
