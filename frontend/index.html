<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IntelliCanvas image editor" />
    <title>IntelliCanvas — Image Editor</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="assets/icons/icon-system.css" />
  </head>
  <body>
    <div class="aurora-background" aria-hidden="true">
      <span class="aurora-orb orb-purple"></span>
      <span class="aurora-orb orb-pink"></span>
      <span class="aurora-orb orb-mint"></span>
      <span class="aurora-orb orb-blue"></span>
    </div>

    <main class="app-shell">
      <header class="app-header">
          <a class="brand" href="./" aria-label="IntelliCanvas home">
          <span class="brand-mark"><span>IC</span></span>
          <span class="brand-copy"><strong>IntelliCanvas</strong><small>Image editor</small></span>
          </a>
      </header>

      <nav class="editor-toolbar" aria-label="Image transformations">
        <button type="button" data-transform="rotate-left" disabled>Rotate Left</button>
        <button type="button" data-transform="rotate-right" disabled>Rotate Right</button>
        <button type="button" data-transform="flip-horizontal" disabled>Flip Horizontal</button>
        <button type="button" data-transform="flip-vertical" disabled>Flip Vertical</button>
      </nav>

      <section class="workspace" aria-label="Image workspace">
        <section class="canvas-panel glass-panel" aria-label="Canvas">
          <div class="canvas-stage" id="canvas-stage">
            <label class="canvas-upload-card" id="canvas-placeholder" for="image-file">
              <span class="upload-card-icon" aria-hidden="true">↑</span>
              <span class="upload-card-title">Drag &amp; drop or click to upload</span>
              <span class="upload-card-formats">PNG · JPG · JPEG · WEBP</span>
            </label>

            <form id="upload-form" class="upload-form">
              <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" />
            </form>

            <canvas id="image-canvas" class="image-canvas" aria-label="Active image canvas"></canvas>

            <div class="canvas-zoom-controls" id="canvas-zoom-controls">
              <button id="zoom-out-button" class="zoom-btn" type="button" aria-label="Zoom out" title="Zoom out">−</button>
              <button id="zoom-reset-button" class="zoom-btn zoom-level-display" type="button" aria-label="Reset zoom (100%)" title="Reset zoom">
                <span id="zoom-level-text">100%</span>
              </button>
              <button id="zoom-in-button" class="zoom-btn" type="button" aria-label="Zoom in" title="Zoom in">+</button>
              <button id="zoom-fit-button" class="zoom-btn" type="button" aria-label="Fit to screen" title="Fit to screen">⊡</button>
            </div>

            <button id="canvas-upload-button" class="canvas-upload-button" type="button" aria-label="Change image" title="Change image">↥</button>
          </div>

          <div id="upload-status" class="status" aria-live="polite"></div>
          <pre id="image-meta" class="image-meta" hidden></pre>

          <footer class="canvas-footer">
            <span><i class="footer-dot" aria-hidden="true"></i> Ready</span>
            <span id="canvas-dimensions">No image</span>
          </footer>
        </section>
      </section>
    </main>

    <script src="js/canvas-manager.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
