[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intellicanvas"
version = "0.9.1"
description = "Privacy-first, explainable image editor."
requires-python = ">=3.11"
# Runtime dependencies stay pinned in backend/requirements.txt; the lockfile
# (quality-gate phase) will be the reproducible source of truth.

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Conservative-but-meaningful set: bugbear (B), pyupgrade (UP) and simplify
# (SIM) on top of the existing pyflakes/isort/ble rules. The line-length bump
# (88 -> 100) is deliberately deferred: it reflows every file and deserves its
# own dedicated commit so these rule adoptions stay reviewable.
select = ["F", "I", "BLE", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/run.py", "backend/wsgi.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
# Floor for Phase 2 of the 2026-09-25 plan; measured coverage is 86%, and the
# plan raises this floor to 85% in the test-pyramid phase.
fail_under = 80
